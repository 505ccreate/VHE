name: Update round-14 log index

on:
  push:
    branches: [main]
    paths:
      - '_LOGS/STATUS-HANDOFF/.ROUND14-INDEX-MARKER'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update only entry 0033
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('_LOGS/LOG-INDEX.md')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          found = False
          summary = (' **Round-14 correction appended 2026-07-31 (`GPT-5-01`, Eli Soren / ChatGPT GitHub lane): '
                     'Update-16 GitHub migration PASS; specification REJECTED with 6 blockers — unified attempt-scoped poll lease, '
                     'durable follower-continuation key, one atomic wake-to-next-state transaction, explicit `budget_refused` routing '
                     'state/order, per-candidate `ProviderChargeEvent[]` transport for direct-ledger accounting, and 8 additive tests. '
                     'No source/blueprint/probe/key/network/spend.**')
          old_status = ('**SPEC — binding correction to 0032 + rounds 5–13 appended; REJECTED at round 13 (7 blockers); '
                        '§4.2 amendment authorized but DEFERRED by Eli (do NOT execute `0034` yet); STILL NOT build-authorized; '
                        'NOTHING built/probed**')
          new_status = ('**SPEC — binding correction to 0032 + rounds 5–14 appended; REJECTED at round 14 (6 blockers); '
                        '`0034` remains reserved/unexecuted; STILL NOT build-authorized; NOTHING built/probed**')
          for line in lines:
              if line.startswith('| [0033]('):
                  found = True
                  if 'Round-14 correction appended 2026-07-31' not in line:
                      marker = ' | **SPEC —'
                      pos = line.rfind(marker)
                      if pos < 0:
                          raise SystemExit('0033 status marker not found')
                      line = line[:pos] + summary + line[pos:]
                  if old_status not in line:
                      raise SystemExit('0033 old status text not found')
                  line = line.replace(old_status, new_status, 1)
              out.append(line)
          if not found:
              raise SystemExit('0033 row not found')
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          grep -q 'Round-14 correction appended 2026-07-31' _LOGS/LOG-INDEX.md
          grep -q 'rounds 5–14 appended; REJECTED at round 14 (6 blockers)' _LOGS/LOG-INDEX.md

      - name: Commit index update
        shell: bash
        run: |
          set -euo pipefail
          rm -f '_LOGS/STATUS-HANDOFF/.ROUND14-INDEX-MARKER'
          rm -f '.github/workflows/update-round14-log-index.yml'
          git config user.name 'Eli Soren'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Index round-14 specification review — Eli Soren'
          git push origin HEAD:main
