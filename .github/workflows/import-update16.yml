name: Import VHE Update 16 baseline

on:
  push:
    paths:
      - 'migration-payload/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/update16-clean
          fetch-depth: 0
      - name: Rebuild verified archive
        shell: bash
        run: |
          set -euo pipefail
          cat migration-payload/part-* | base64 -d > /tmp/vhe16-operational.tar.xz
          echo 'f7972ef58714377e626b352cef6227993be172676fdec5da46b1ecce05deea13  /tmp/vhe16-operational.tar.xz' | sha256sum -c -
      - name: Import baseline
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/vhe16-operational.tar.xz -C .
          rm -rf migration-payload
          rm -f .github/workflows/import-update16.yml
          git config user.name 'Eli Soren'
          git config user.email 'eli-soren@users.noreply.github.com'
          git add -A
          git commit -m 'Import authoritative VHE Update 16 operational baseline — Eli Soren'
          git push origin HEAD:migration/update16-clean
