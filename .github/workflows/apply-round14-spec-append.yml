name: Apply verified round-14 specification append

on:
  push:
    branches: [main]
    paths:
      - '_LOGS/STATUS-HANDOFF/.ROUND14-APPEND-PAYLOAD.md'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authoritative pre-append file
        shell: bash
        run: |
          set -euo pipefail
          TARGET='_LOGS/ISSUE-RESOLUTION-LOG/VHE-ISSUE-LOG-0033_removal-lane-binding-correction_CC-OPUS-01.md'
          PAYLOAD='_LOGS/STATUS-HANDOFF/.ROUND14-APPEND-PAYLOAD.md'
          test -f "$TARGET"
          test -f "$PAYLOAD"
          test "$(git hash-object "$TARGET")" = 'da691ef89021424b873d25239e69871f40f9158d'
          cp "$TARGET" /tmp/0033-before.md

      - name: Append round 14 without rewriting prior bytes
        shell: bash
        run: |
          set -euo pipefail
          TARGET='_LOGS/ISSUE-RESOLUTION-LOG/VHE-ISSUE-LOG-0033_removal-lane-binding-correction_CC-OPUS-01.md'
          PAYLOAD='_LOGS/STATUS-HANDOFF/.ROUND14-APPEND-PAYLOAD.md'
          cat "$PAYLOAD" >> "$TARGET"
          BEFORE_SIZE=$(wc -c < /tmp/0033-before.md)
          head -c "$BEFORE_SIZE" "$TARGET" > /tmp/0033-prefix.md
          cmp -s /tmp/0033-before.md /tmp/0033-prefix.md
          grep -q 'ROUND 14 APPEND' "$TARGET"
          grep -q 'Eli Soren (`GPT-5-01`)' "$TARGET"

      - name: Remove transport-only files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f '_LOGS/STATUS-HANDOFF/.ROUND14-APPEND-PAYLOAD.md'
          rm -f '.github/workflows/apply-round14-spec-append.yml'
          git config user.name 'Eli Soren'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Append round-14 removal-lane correction — Eli Soren'
          git push origin HEAD:main
